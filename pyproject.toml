[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-whitepaper"
version = "0.1.0"
description = "自驱永续进化预测修正Agent系统"
requires-python = ">=3.8"
authors = [
    { name = "Agent Whitepaper Team", email = "2358384171@qq.com" },
]
dependencies = [
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
full = [
    "msgpack>=1.0.0",
    "sympy>=1.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
agentwp = "agent_whitepaper.stage_h.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff 配置 - 命名规范统一（阶段O）
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src"]
extend-exclude = ["archive", "stages"]

[tool.ruff.lint]
# 启用的规则集:
#   N   = pep8-naming（命名规范核心）
#   E   = pycodestyle errors
#   W   = pycodestyle warnings
#   I   = isort（import 排序）
#   F   = pyflakes（未使用变量等）
#   UP  = pyupgrade（语法现代化）
select = ["N", "E", "W", "I", "F", "UP"]

# 忽略的规则（合理豁免）:
#   E501 = 行过长（由 line-length 控制，不强制折行）
#   N802 = 函数名应为小写（CLI命令函数 cmd_init 等需保留蛇形，已合规）
#   N803 = 参数名应为小写（QTable 等大写参数是领域约定）
#   N806 = 变量名应为小写（Q, T 等数学符号是领域约定）
#   UP007 = Optional[X] 联合类型（保持兼容 py38）
#   UP045 = Optional[X] 联合类型（保持兼容 py38）
ignore = [
    "E501",
    "N802",
    "N803",
    "N806",
    "UP007",
    "UP045",
]

[tool.ruff.lint.pep8-naming]
# 自定义命名约定
extend-ignore-names = [
    # 数学/领域约定允许的大写名
    "Q",
    "T",
    "N",
    "M",
    "K",
    # 常量缩写
    "MAX",
    "MIN",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py: 重导出是设计意图，F401 豁免
"__init__.py" = ["F401"]
# 测试文件: 导入用于可导入性验证，F401 豁免
"tests/*" = ["F401"]
# demos: 演示代码允许宽松
"demos/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["agent_whitepaper"]

# ---------------------------------------------------------------------------
# Pytest 配置
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["src/agent_whitepaper/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
